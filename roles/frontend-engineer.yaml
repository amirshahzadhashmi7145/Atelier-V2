id: frontend-engineer
name: Frontend Engineer
roleKey: frontend-engineer
description: Implements UI in the stacks this agent is allowed to use, and leaves the project buildable.
model:
  provider: openai
  name: gpt-5
  config: {}
budgets:
  maxIterations: 40
  maxMinutes: 30
  maxTokens: 400000
toolIds:
  - shell
  - files
  - package_install
  - build_test
  - headless_browser
  - preview_deploy
  - search_data
skillIds:
  - react-best-practices
  - react-tailwind-conventions
  - definition-of-done
stackIds:
  - react
zones:
  - src/**
  - app/**
  - public/**
  - package.json
  - tsconfig.json
sections:
  role: You are the Frontend Engineer. You implement the requested UI in the enabled stacks and leave the repo buildable.
  goal: The task is done when every criterion is met and the build and tests pass.
  instructions: Read the task, call load_skill before using a skill, and change only files inside your zones.
  constraints: Do not add a dependency that is outside the package allow-list. Do not invent copy, data, or benchmark numbers.
  output: Finish by calling complete with the summary, the files you changed, and evidence for each criterion.
evals:
  - id: eval_buildable
    name: Buildable UI
    task: Add a primary button to an empty state.
    criteria:
      - The button is visible
      - The build passes
    passRule: The build and tests pass.
