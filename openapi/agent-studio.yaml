openapi: 3.1.0
info:
  title: Agent Studio API
  version: 0.4.0
  description: Contract for the studio, the API, and the runtime. Both sides generate types from this file.
servers:
  - url: http://localhost:8000
    description: Local API
tags:
  - name: agents
  - name: tools
  - name: skills
  - name: stacks
  - name: models
  - name: providers
  - name: settings
  - name: library
  - name: runs
paths:
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentDefinition"
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: createAgent
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDefinition"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /agents/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getAgent
      tags: [agents]
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDefinition"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAgent
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDefinition"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAgent
      tags: [agents]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"
  /agents/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listPromptVersions
      tags: [agents]
      responses:
        "200":
          description: Versions, newest last
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptVersion"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: createPromptVersion
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptVersionCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptVersion"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /agents/{id}/versions/{v}/activate:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/Version"
    post:
      operationId: activatePromptVersion
      tags: [agents]
      responses:
        "200":
          description: Activated. Rejected unless every eval on the agent has status pass on this version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptVersion"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /agents/{id}/versions/{v}/diff:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/Version"
      - name: against
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: diffPromptVersions
      tags: [agents]
      responses:
        "200":
          description: Section diff of version v against the against version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptDiff"
        "404":
          $ref: "#/components/responses/Error"
  /agents/{id}/compile-preview:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: compilePreview
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompilePreviewRequest"
      responses:
        "200":
          description: Compiled prompt for the unsaved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompilePreview"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /tools:
    get:
      operationId: listTools
      tags: [tools]
      responses:
        "200":
          description: Tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToolDefinition"
    post:
      operationId: createTool
      tags: [tools]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDefinition"
        "422":
          $ref: "#/components/responses/Error"
  /tools/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateTool
      tags: [tools]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDefinition"
        "404":
          $ref: "#/components/responses/Error"
  /tools/mcp/discover:
    post:
      operationId: discoverMcpTools
      tags: [tools]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpDiscoverRequest"
      responses:
        "200":
          description: Tools advertised by the server. Does not create entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpDiscoverResult"
        "400":
          $ref: "#/components/responses/Error"
  /tools/api/import:
    post:
      operationId: importApiSpec
      tags: [tools]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiImportRequest"
      responses:
        "200":
          description: Operations in the spec. Does not create entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiImportResult"
        "400":
          $ref: "#/components/responses/Error"
  /data-sources:
    get:
      operationId: listDataSources
      tags: [tools]
      responses:
        "200":
          description: Data sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSource"
    post:
      operationId: createDataSource
      tags: [tools]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataSourceCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSource"
        "422":
          $ref: "#/components/responses/Error"
  /data-sources/{id}/refresh:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: refreshDataSource
      tags: [tools]
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSource"
        "404":
          $ref: "#/components/responses/Error"
  /skills:
    get:
      operationId: listSkills
      tags: [skills]
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
    post:
      operationId: createSkill
      tags: [skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "422":
          $ref: "#/components/responses/Error"
  /skills/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSkill
      tags: [skills]
      responses:
        "200":
          description: Skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSkill
      tags: [skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "404":
          $ref: "#/components/responses/Error"
  /skills/import:
    post:
      operationId: importSkill
      tags: [skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillImportRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SkillZipImport"
      responses:
        "200":
          description: Preview, not saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillImportResult"
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillImportResult"
        "400":
          $ref: "#/components/responses/Error"
  /stacks:
    get:
      operationId: listStacks
      tags: [stacks]
      responses:
        "200":
          description: Stacks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TechStack"
    post:
      operationId: createStack
      tags: [stacks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StackCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechStack"
        "422":
          $ref: "#/components/responses/Error"
  /stacks/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateStack
      tags: [stacks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StackPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechStack"
        "404":
          $ref: "#/components/responses/Error"
  /models:
    get:
      operationId: listModels
      tags: [models]
      responses:
        "200":
          description: Chat models discovered from the provider, cached for one hour, plus ownStats from runs. Non-chat families are omitted. Empty until a refresh.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelInfo"
  /settings/runs:
    get:
      operationId: getRunSettings
      tags: [settings]
      responses:
        "200":
          description: Platform defaults for every run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSettings"
    put:
      operationId: saveRunSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunSettings"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSettings"
  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      responses:
        "200":
          description: Provider slots. Keys are never returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderStatus"
  /providers/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: saveProviderKey
      tags: [providers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderKey"
      responses:
        "200":
          description: Stored by reference. The key is not in the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatus"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /providers/{id}/test:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: testProvider
      tags: [providers]
      responses:
        "200":
          description: Connection result. Does not echo the key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatus"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /providers/{id}/refresh:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: refreshProviderModels
      tags: [providers]
      responses:
        "200":
          description: Replaces the model cache.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelInfo"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /library:
    get:
      operationId: listLibrary
      tags: [library]
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/LibraryKind"
      responses:
        "200":
          description: Templates the user can import. Nothing here is installed until import.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryItem"
        "400":
          $ref: "#/components/responses/Error"
  /library/{id}/import:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: importLibraryItem
      tags: [library]
      responses:
        "201":
          description: Imports the template. An agent import also copies the skills and stacks it names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryImport"
        "404":
          $ref: "#/components/responses/Error"
  /agents/{id}/evals:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: createEval
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalCreate"
      responses:
        "201":
          description: Agent with the new eval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDefinition"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /agents/{id}/evals/{evalId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: evalId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteEval
      tags: [agents]
      responses:
        "200":
          description: Agent without that eval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDefinition"
        "404":
          $ref: "#/components/responses/Error"
  /agents/{id}/versions/{v}/evals/run:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/Version"
    post:
      operationId: runEvals
      tags: [agents]
      responses:
        "200":
          description: Runs every eval and stores the results on this version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptVersion"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      parameters:
        - name: agentId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RunStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: One page of runs, 20 per page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
    post:
      operationId: createRun
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCreate"
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /runs/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getRun
      tags: [runs]
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/Error"
  /runs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: after
        in: query
        description: Last seq the client already applied. Events with seq less than or equal to this are omitted.
        schema:
          type: integer
          minimum: 0
          default: 0
    get:
      operationId: streamRunEvents
      tags: [runs]
      responses:
        "200":
          description: |
            Server-sent events. Each frame is `id: <seq>`, `event: <type>`, `data: <Event JSON>`.
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"
  /runs/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: stopRun
      tags: [runs]
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /runs/{id}/client-tool-result:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: submitClientToolResult
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientToolResult"
      responses:
        "200":
          description: Accepted and the run resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /runs/{id}/answer:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: answerClarification
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClarificationAnswer"
      responses:
        "200":
          description: Accepted and the run resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /runs/{id}/diff:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getRunDiff
      tags: [runs]
      responses:
        "200":
          description: Workspace diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDiff"
        "404":
          $ref: "#/components/responses/Error"
  /runs/{id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listRunArtifacts
      tags: [runs]
      responses:
        "200":
          description: Screenshots, zip, and preview
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artifact"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Version:
      name: v
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: [object, "null"]
          additionalProperties: true
    ModelSelection:
      type: object
      additionalProperties: false
      required: [provider, name, config]
      properties:
        provider:
          type: string
        name:
          type: string
        config:
          type: object
          additionalProperties: true
          description: Validated against the model's configSchema.
    ModelRef:
      type: object
      additionalProperties: false
      required: [provider, name]
      properties:
        provider:
          type: string
        name:
          type: string
    Budgets:
      type: object
      additionalProperties: false
      required: [maxIterations, maxMinutes, maxTokens]
      properties:
        maxIterations:
          type: integer
          minimum: 1
        maxMinutes:
          type: integer
          minimum: 1
        maxTokens:
          type: integer
          minimum: 1
    PromptSections:
      type: object
      additionalProperties: false
      required: [role, goal, instructions, constraints, output]
      properties:
        role:
          type: string
        goal:
          type: string
        instructions:
          type: string
        constraints:
          type: string
        output:
          type: string
    AgentDefinition:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - roleKey
        - description
        - model
        - activePromptVersionId
        - toolIds
        - skillIds
        - stackIds
        - zones
        - evals
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        roleKey:
          type: string
        description:
          type: string
        model:
          $ref: "#/components/schemas/ModelSelection"
        activePromptVersionId:
          type: [string, "null"]
        toolIds:
          type: array
          items:
            type: string
        skillIds:
          type: array
          items:
            type: string
        stackIds:
          type: array
          items:
            type: string
        zones:
          type: array
          items:
            type: string
        evals:
          type: array
          items:
            $ref: "#/components/schemas/Eval"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentCreate:
      type: object
      additionalProperties: false
      required: [name, roleKey, description, model]
      properties:
        name:
          type: string
        roleKey:
          type: string
        description:
          type: string
        model:
          $ref: "#/components/schemas/ModelSelection"
        toolIds:
          type: array
          items:
            type: string
        skillIds:
          type: array
          items:
            type: string
        stackIds:
          type: array
          items:
            type: string
        zones:
          type: array
          items:
            type: string
    AgentPatch:
      type: object
      additionalProperties: false
