[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///atelier.db

[loggers]
keys = root
level = WARN
handlers = console
qualname =

[handlers]
keys = console
class = StreamHandler
args = (sys.stderr,)

[formatters]
keys = generic
format = %(message)s

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET

[formatter_generic]
format = %(message)s
