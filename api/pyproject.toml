[project]
name = "agent-studio-api"
version = "0.6.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2",
  "alembic>=1.14",
  "pydantic>=2",
  "httpx>=0.27",
  "openai>=1.50",
  "google-genai>=1.0",
  "litellm==1.83.0",
  "cryptography>=44",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "docker>=7",
  "tiktoken>=0.8",
  "langgraph==1.2.12",
  "langgraph-checkpoint-sqlite==3.1.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-rerunfailures>=14"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "store*", "runtime*", "gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A few supervisor/graph tests exercise background threads and are timing-sensitive
# on loaded runners. Retry only failures (a real, deterministic bug still fails all
# attempts and surfaces); flaky timing passes on a retry.
addopts = "--reruns 2 --reruns-delay 1"
